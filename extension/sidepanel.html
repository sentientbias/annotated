<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
body { font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 16px; color: #111; }
h2 { font-size: 15px; margin: 0 0 4px; }
.quote { background: #f6f6f6; border-left: 4px solid #ffd640; padding: 10px 12px;
  border-radius: 0 8px 8px 0; font-style: italic; margin: 8px 0 14px; }
.ann { border: 1px solid #e5e5e5; border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
.ann .who { font-weight: 700; font-size: 13px; }
.ann .when { color: #888; font-size: 12px; margin-left: 6px; }
.badge { display: inline-block; font-size: 11px; font-weight: 800; border-radius: 6px;
  padding: 2px 8px; margin-right: 6px; }
.b-dispute { background: #fdeeee; color: #c22; }
.b-agree { background: #e9f7ef; color: #1d7a44; }
.b-context { background: #eaf2fd; color: #2563a8; }
.follow { float: right; font-size: 12px; background: #111; color: #ffd640; border: none;
  border-radius: 8px; padding: 4px 10px; cursor: pointer; font-weight: 700; }
.empty { color: #777; }
</style></head><body>
<h2 id="panel-title">Annotations</h2>
<div class="quote" id="quote">…</div>
<div id="list"><span class="empty">Loading…</span></div>
<div id="recorder" style="display:none;margin-top:12px;">
  <button id="recbtn" style="background:#111;color:#ffd640;border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer;">🎙 Record audio reply</button>
  <span id="recstatus" style="font-size:12px;color:#777;margin-left:8px;"></span>
</div>
<script src="sidepanel.js"></script>
</body></html>
