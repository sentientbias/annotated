<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
body { font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 0; width: 320px; color: #111; }
header { background: #111; color: #ffd640; padding: 14px 16px; font-weight: 800; font-size: 16px; }
main { padding: 12px 16px; }
.row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
.row b { font-size: 18px; }
label { font-size: 12px; color: #666; display: block; margin-top: 10px; }
input { width: 100%; box-sizing: border-box; padding: 8px; border: 2px solid #ddd; border-radius: 8px; margin-top: 4px; font-size: 14px; }
button { margin-top: 12px; width: 100%; background: #111; color: #ffd640; border: none;
  border-radius: 10px; padding: 10px; font-weight: 700; font-size: 14px; cursor: pointer; }
.hint { font-size: 12px; color: #777; margin-top: 10px; }
a { color: #2f7fd0; }
</style></head><body>
<header>⚑ Annotated</header>
<main>
  <div class="row"><span>Disputes you've posted</span><b id="mine">–</b></div>
  <div class="row"><span>Disputes on this page</span><b id="page">–</b></div>
  <label>API server
    <input id="api" placeholder="https://annotated-api.onrender.com" />
  </label>
  <button id="save">Save</button>
  <hr style="border:none;border-top:1px solid #eee;margin:12px 0;" />
  <div id="signedout">
    <button id="xlogin">Sign in with X</button>
    <button id="glogin" style="background:#fff;color:#111;border:2px solid #111;margin-top:8px;">Sign in with Google</button>
    <label>Paste token (from web sign-in)
      <input id="token" placeholder="paste token…" />
    </label>
    <button id="link">Link account</button>
  </div>
  <div id="signedin" style="display:none;">
    <div class="row"><span>Signed in as</span><b id="who">–</b></div>
    <button id="signout" style="background:#eee;color:#333;">Sign out</button>
  </div>
  <div class="hint">Select any sentence on a page, hit <b>⚑ Dispute this</b>, and add your receipt. <a id="trend" href="#">Trending disputes →</a> · <a id="feed" href="#">Public feed →</a></div>
</main>
<script src="popup.js"></script>
</body></html>
